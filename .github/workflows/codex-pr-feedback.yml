# Revises an open pull request when a reviewer asks the agent to, in a comment.
#
# Comment "@codex <instruction>" on a pull request, or write it in a review, and
# the agent checks out that pull request's branch, makes the change, and pushes
# back to the same branch. The rest of this template is one-shot per issue; this
# is the loop that lets a reviewer ask for a revision without starting over.
#
# Runs only when the AGENT_PROVIDER repository variable is set to openai-codex.
# A separate workflow does the same job for the Claude provider, listening for a
# different phrase, so only one of the two is ever active in a repository.
#
# Who can use it: only collaborators with write or admin access. The check runs
# before the repository is checked out. Without it, on a public repository any
# passer-by could direct an agent that can write to the code.
#
# Why it does not trigger itself: it fires only on comments containing the
# literal phrase "@codex". The agent's own progress and summary comments do not
# contain it, so they start a run that immediately skips.
#
# Something a reader may not expect:
#
#   A comment event does not check out the pull request. GitHub checks out the
#   repository's default branch, because a comment is not inherently attached to
#   any branch. The agent used here has no notion of a pull request either. So
#   the two steps below look up the pull request's branch and check it out by
#   name. Without them the agent would edit the default branch and push its work
#   somewhere unrelated to the pull request being discussed.

name: Codex PR Feedback

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# One run at a time per pull request. Two requests in quick succession, or one
# arriving while the agent is still working, would otherwise put two agents on
# the same branch at once, each overwriting the other's commits.
#
# Queued rather than cancelled, deliberately: an agent stopped part-way through
# editing files leaves nothing behind and reports nothing useful, so waiting a
# few minutes is the better trade.
concurrency:
  group: codex-pr-feedback-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  codex-pr-feedback:
    if: |
      vars.AGENT_PROVIDER == 'openai-codex' &&
      (
        (github.event_name == 'issue_comment' && github.event.issue.pull_request != null && contains(github.event.comment.body, '@codex')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@codex')) ||
        (github.event_name == 'pull_request_review' && github.event.review.body != null && contains(github.event.review.body, '@codex'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read

    steps:
      # Only collaborators with write or admin access may direct the agent.
      # This runs before the repository is checked out, so an unauthorised
      # request costs nothing and touches nothing.
      - name: Check commenter permissions
        id: permission-check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const p = context.payload;
            const commenter = (p.comment && p.comment.user.login) || (p.review && p.review.user.login);
            const prNumber = (p.issue && p.issue.number) || (p.pull_request && p.pull_request.number);
            let permLevel = 'none';
            try {
              const r = await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner, repo: context.repo.repo, username: commenter,
              });
              permLevel = r.data.permission;
            } catch (err) {
              permLevel = 'none';
            }
            const allowed = ['write', 'admin'].includes(permLevel);
            console.log(`Commenter ${commenter} has permission: ${permLevel} — allowed: ${allowed}`);
            if (!allowed && prNumber) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: prNumber,
                body: `@${commenter} Only collaborators with write access can drive \`@codex\` here — request ignored.`,
              });
            }
            core.setOutput('allowed', allowed ? 'true' : 'false');

      # A comment event does not say which branch the pull request uses, so it
      # is looked up here.
      #
      # Pull requests from forks are refused rather than handled. Their branch
      # lives in a repository this one does not control, and its contents can
      # be changed by whoever owns that fork at any time. Checking it out and
      # running an agent that holds a write-capable token over it would turn
      # "can open a pull request" into "can change this repository".
      #
      # Note that the permission check above does not cover this. It governs
      # who may ask for a run, which is a different question from whose code
      # the run would execute.
      - name: Resolve the pull request's head branch
        id: pr
        if: steps.permission-check.outputs.allowed == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const p = context.payload;
            const number = (p.issue && p.issue.number) || (p.pull_request && p.pull_request.number);
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner, repo: context.repo.repo, pull_number: number,
            });

            const thisRepo = `${context.repo.owner}/${context.repo.repo}`;
            const headRepo = pr.head.repo ? pr.head.repo.full_name : '(deleted)';

            if (headRepo !== thisRepo) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: number,
                body: [
                  '`@codex` does not run on pull requests from forks.',
                  '',
                  `This PR's head branch lives in \`${headRepo}\`. Running an agent with write`,
                  'access over a branch this repository does not control would hand whoever',
                  'owns that fork the ability to change this one.',
                  '',
                  'Push the branch to this repository and reopen the pull request if you want',
                  'the agent to work on it.',
                ].join('\n'),
              });
              core.setOutput('ok', 'false');
              return;
            }

            console.log(`PR #${number} head branch: ${pr.head.ref}`);
            core.setOutput('ok', 'true');
            core.setOutput('head_ref', pr.head.ref);

      - name: Checkout the pull request's branch
        if: steps.pr.outputs.ok == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.pr.outputs.head_ref }}
          fetch-depth: 0

      - name: Run Codex (tag mode)
        if: steps.pr.outputs.ok == 'true'
        uses: ./.github/actions/codex-run
        with:
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          github_token: ${{ github.token }}
          trigger_phrase: "@codex"
