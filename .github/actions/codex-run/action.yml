name: "Run Codex"
description: >-
  Runs the Codex agent with this repository's agreed sandbox settings, and
  reports what the run produced. Used by every workflow here that invokes Codex.

# What this is
#
# A single definition of how this repository runs the Codex agent. Four
# workflows need to invoke it. They implement an issue directly, write a plan
# for a complex one, implement an approved plan, and respond to a review
# comment on an open pull request. All four call this action rather than
# `openai/codex-action` directly.
#
# The reason to centralise it is the sandbox setting below. An agent run takes
# an issue or comment body as its instructions, and that text is written by
# whoever opened the issue. What the run is then permitted to do is a security
# boundary, and a boundary defined in four places is one that eventually
# disagrees with itself.
#
# Things a reader may not expect
#
# `openai/codex-action` is a thin wrapper around the Codex CLI. It runs the
# agent and returns what the agent said. It does not know about pull requests,
# comments, or the event that triggered the workflow, so three jobs that might
# look like the action's are done here instead:
#
#   1. Working out the prompt. When this action is called without one, it
#      builds the prompt from the comment that triggered the run. The upstream
#      action has no concept of a trigger phrase.
#
#   2. Reporting. The action's only output is the agent's closing message.
#      There is no turn count, token usage or cost figure available to report,
#      so the job summary shows that message and nothing more. A thin summary
#      here reflects what the upstream action exposes; it is not a piece of
#      this file left unfinished.
#
#   3. GitHub credentials. The agent opens pull requests using the `gh` CLI,
#      which needs a token in its environment. That token is passed in as an
#      input and exported below.
#
# Credentials arrive as inputs because a composite action cannot read the
# `secrets` context of the workflow that calls it. Callers pass
# `${{ secrets.OPENAI_API_KEY }}`.
#
# `timeout-minutes` is deliberately absent here and set by each calling job
# instead: GitHub Actions ignores that key on a step inside a composite action,
# so setting it here would look effective and do nothing.
# scripts/validate-workflows.sh checks the calling jobs agree on a value.

inputs:
  openai_api_key:
    description: "OpenAI API key. Used for the Responses API proxy the action starts."
    required: true
  prompt:
    description: >-
      Instructions for the agent. Leave empty to select tag mode, which
      codex-pr-feedback.yml relies on.
    required: false
    default: ""
  trigger_phrase:
    description: "Phrase that triggers tag mode. Only meaningful when `prompt` is empty."
    required: false
    default: "@codex"
  report_issue_number:
    description: >-
      Issue to report a do-nothing run on. Leave empty to write the job summary
      only. codex-pr-feedback.yml runs against a pull request comment, where
      there is no issue to report to.
    required: false
    default: ""
  github_token:
    description: >-
      Token passed to the agent as GH_TOKEN so it can open a pull request, and
      used to post the do-nothing comment. Required with report_issue_number.
    required: false
    default: ""

runs:
  using: composite
  steps:
    # ── Work out what the agent was asked to do ───────────────────────────────
    #
    # Most callers pass an explicit prompt. The pull request feedback workflow
    # does not: there, the instruction is whatever a reviewer typed after the
    # trigger phrase in a comment, so it has to be read out of the event that
    # started the run.
    #
    # That text is untrusted. Anyone who can comment decides what it says, and
    # it becomes the agent's instructions verbatim. What limits the damage is
    # the permission check in the calling workflow, which refuses anyone
    # without write access before this action is reached. Nothing in this step
    # filters or sanitises the text, and it should not be read as doing so.
    - name: Work out the prompt
      id: resolve
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        GIVEN_PROMPT: ${{ inputs.prompt }}
        TRIGGER_PHRASE: ${{ inputs.trigger_phrase }}
      with:
        script: |
          const given = process.env.GIVEN_PROMPT || '';
          if (given.trim()) {
            core.setOutput('prompt', given);
            return;
          }

          const p = context.payload;
          const body =
            (p.comment && p.comment.body) ||
            (p.review && p.review.body) ||
            '';

          const phrase = process.env.TRIGGER_PHRASE || '@codex';
          const at = body.indexOf(phrase);
          const instruction = (at === -1 ? body : body.slice(at + phrase.length)).trim();

          if (!instruction) {
            core.setFailed(
              `Tag mode was selected but the comment carried no instruction after "${phrase}".`);
            return;
          }

          const prNumber =
            (p.issue && p.issue.number) || (p.pull_request && p.pull_request.number);

          core.setOutput('prompt', [
            `A reviewer has asked for a change on pull request #${prNumber}.`,
            '',
            'Their request, verbatim:',
            '',
            instruction,
            '',
            'Make the change on the pull request\'s existing branch, which is already',
            'checked out. Commit and push to that same branch. Do NOT open a new pull',
            'request. If the request is unclear, comment on the pull request asking for',
            'clarification rather than guessing.',
          ].join('\n'));

    - name: Codex
      id: codex
      uses: openai/codex-action@86365089eb2b84e0a8fb0717b304f8bdcb13b20e # v1.12
      env:
        # The agent opens its own pull request by running `gh`, which reads its
        # credentials from this variable.
        #
        # Worth knowing before anyone debugs a missing CI run: GitHub does not
        # start workflow runs from events caused by the built-in workflow token.
        # A pull request opened by this agent therefore arrives with no checks
        # on it. To get CI on agent pull requests, pass a personal access token
        # as `github_token` from the calling workflow instead.
        GH_TOKEN: ${{ inputs.github_token }}
      with:
        openai-api-key: ${{ inputs.openai_api_key }}
        prompt: ${{ steps.resolve.outputs.prompt }}

        # Full filesystem and network access, inside the throwaway container
        # GitHub creates for this job and destroys when it ends.
        #
        # This is permissive, and the name is meant to make you look twice, so
        # it is worth stating why it is set. The run exists to push a branch and
        # open a pull request, so it needs the network. The sandbox choices are
        # coarse. They are read-only, workspace-write, or this, with no way to
        # say "network access for git and gh, nothing else". Of the three, this
        # is the only one that lets the run finish its job.
        #
        # So this setting is not what keeps an agent run safe. What keeps it
        # safe is that only a repository collaborator with write access can
        # start one: every workflow that calls this action checks that first,
        # before any agent code runs. Read that check as the real boundary and
        # this line as a consequence of it.
        #
        # A narrower `permission-profile` (a config.toml under `codex-home`)
        # can express more, and is worth adopting. It is not used here because
        # a profile that is subtly wrong grants more than intended while
        # appearing to grant less, and it should be written against a run you
        # have watched rather than from the documentation alone.
        sandbox: danger-full-access

        # Removes the running user from the sudo group before starting the
        # agent. This is already the upstream action's default; it is written
        # out so that changing it requires a visible edit to this file, rather
        # than happening quietly if that default is ever changed upstream.
        safety-strategy: drop-sudo

    # ── Report what the run actually did ──────────────────────────────────────
    #
    # The agent's closing message is the only thing the upstream action returns,
    # and it is worth putting somewhere visible: it is where a run that gave up
    # explains itself. Without this step that explanation exists only in the raw
    # job log, which nobody reads unless they already suspect a problem.
    - name: Summarise the run
      if: always()
      shell: bash
      env:
        FINAL_MESSAGE: ${{ steps.codex.outputs.final-message }}
      run: |
        {
          echo "### Agent run (Codex)"
          echo ""
        } >> "$GITHUB_STEP_SUMMARY"

        if [[ -z "${FINAL_MESSAGE:-}" ]]; then
          {
            echo "The run ended without a closing message. This is what a timeout looks"
            echo "like: the agent was stopped part-way and never reported."
            echo ""
            echo "If the work looked close, raise \`timeout-minutes\` on this job."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi

        {
          echo "The agent's closing message:"
          echo ""
          echo '```'
          printf '%s\n' "$FINAL_MESSAGE"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

    # An agent can finish, report success, and produce nothing. That is the
    # failure worth catching here, because nothing else reports it: the job is
    # green, the issue stays silent, and whoever asked for the work waits for a
    # pull request that is never coming.
    #
    # The check asks GitHub whether an open pull request references the issue,
    # rather than asking the agent whether it opened one. An agent that has
    # lost track of what it did is exactly the case this needs to catch.
    - name: Say so when the run produced nothing
      if: always() && inputs.report_issue_number != '' && inputs.github_token != ''
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        github-token: ${{ inputs.github_token }}
        script: |
          const n = Number('${{ inputs.report_issue_number }}');
          const { data: prs } = await github.rest.pulls.list({
            owner: context.repo.owner, repo: context.repo.repo,
            state: 'open', per_page: 100,
          });
          const opened = prs.some(pr =>
            pr.body && new RegExp(`(closes|fixes|resolves)\\s+#${n}\\b`, 'i').test(pr.body));
          if (opened) return;

          const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

          const lines = [
            '### The agent ran, but produced no pull request',
            '',
            `Full detail: [job summary and log](${runUrl}). The job summary carries the`,
            'agent\'s own closing message, which is usually where it says why it stopped.',
            '',
            'Codex reports no turn count, cost or permission-denial count. The action',
            'exposes only its final message, so unlike the Claude path there are no run',
            'statistics to check here.',
            '',
            'A run that changes nothing and reports success is the failure this template',
            'exists to prevent, so it is reported here rather than left silent.',
          ];

          // Update our own previous report rather than stacking a new one.
          const MARKER = '<!-- agentic-workflow:run-report -->';
          const body = [MARKER, ...lines].join('\n');

          const { data: existing } = await github.rest.issues.listComments({
            owner: context.repo.owner, repo: context.repo.repo,
            issue_number: n, per_page: 100,
          });
          const mine = existing.find(c => c.body && c.body.includes(MARKER));

          if (mine) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner, repo: context.repo.repo,
              comment_id: mine.id, body,
            });
            return;
          }
          await github.rest.issues.createComment({
            owner: context.repo.owner, repo: context.repo.repo,
            issue_number: n, body,
          });
